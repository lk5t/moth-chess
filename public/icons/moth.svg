<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b24"/>
      <stop offset="1" stop-color="#0e0d13"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset="1" stop-color="#5b4bd6"/>
    </linearGradient>
    <linearGradient id="wing2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#3a2f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="27.5" fill="none" stroke="#8b7bff" stroke-opacity="0.35"/>
  <circle cx="64" cy="62" r="48" fill="url(#glow)"/>
  <!-- upper wings -->
  <path d="M60 50 C44 26 18 22 14 34 C10 48 24 66 58 66 Z" fill="url(#wing)"/>
  <path d="M68 50 C84 26 110 22 114 34 C118 48 104 66 70 66 Z" fill="url(#wing)"/>
  <!-- lower wings -->
  <path d="M59 68 C38 70 26 84 32 96 C38 106 54 96 61 76 Z" fill="url(#wing2)"/>
  <path d="M69 68 C90 70 102 84 96 96 C90 106 74 96 67 76 Z" fill="url(#wing2)"/>
  <!-- neural dots on wings -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="30" cy="38" r="2.6"/><circle cx="42" cy="50" r="2.2"/><circle cx="26" cy="52" r="1.8"/>
    <circle cx="98" cy="38" r="2.6"/><circle cx="86" cy="50" r="2.2"/><circle cx="102" cy="52" r="1.8"/>
    <circle cx="42" cy="88" r="1.8"/><circle cx="86" cy="88" r="1.8"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.1" fill="none">
    <path d="M30 38 L42 50 L26 52 Z"/><path d="M98 38 L86 50 L102 52 Z"/>
  </g>
  <!-- body -->
  <ellipse cx="64" cy="66" rx="6" ry="24" fill="#e9e4ff"/>
  <ellipse cx="64" cy="66" rx="6" ry="24" fill="none" stroke="#5b4bd6" stroke-width="1.2"/>
  <!-- antennae -->
  <path d="M61 44 C56 32 50 26 44 24" stroke="#d8d0ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M67 44 C72 32 78 26 84 24" stroke="#d8d0ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="44" cy="24" r="3" fill="#d8d0ff"/><circle cx="84" cy="24" r="3" fill="#d8d0ff"/>
</svg>
